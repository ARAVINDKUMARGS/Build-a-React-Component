<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aravind Kumar GS | Developer Profile Card</title>
  
  <!-- Meta tags for SEO & Social Sharing -->
  <meta name="description" content="Interactive Developer Profile Card of Aravind Kumar GS - Full Stack Developer & CSE Student. Built for ApnoAI Web Development Internship." />
  <meta name="author" content="Aravind Kumar GS" />

  <!-- Inline Favicon to eliminate 404 console warnings -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👨‍💻</text></svg>" />

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React 18 & ReactDOM via CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone (Compiles JSX directly in browser) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Tailwind Configuration for Custom Theme & Glassmorphism -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              400: '#818cf8',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
            },
            accent: {
              cyan: '#06b6d4',
              emerald: '#10b981',
              rose: '#f43f5e',
              amber: '#f59e0b',
              violet: '#8b5cf6',
            }
          },
          animation: {
            'blob-float-1': 'blobFloat1 18s ease-in-out infinite alternate',
            'blob-float-2': 'blobFloat2 22s ease-in-out infinite alternate',
            'blob-float-3': 'blobFloat3 26s ease-in-out infinite alternate',
            'pulse-subtle': 'pulseSubtle 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'heart-pop': 'heartPop 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275)',
            'badge-shine': 'badgeShine 4s linear infinite',
          },
          keyframes: {
            blobFloat1: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '50%': { transform: 'translate(60px, -40px) scale(1.15)' },
              '100%': { transform: 'translate(-30px, 50px) scale(0.95)' },
            },
            blobFloat2: {
              '0%': { transform: 'translate(0px, 0px) scale(1)' },
              '50%': { transform: 'translate(-70px, 60px) scale(1.12)' },
              '100%': { transform: 'translate(50px, -30px) scale(0.9)' },
            },
            blobFloat3: {
              '0%': { transform: 'translate(0px, 0px) scale(0.95)' },
              '50%': { transform: 'translate(40px, 40px) scale(1.1)' },
              '100%': { transform: 'translate(-50px, -50px) scale(1.05)' },
            },
            pulseSubtle: {
              '0%, 100%': { opacity: '0.85', transform: 'scale(1)' },
              '50%': { opacity: '1', transform: 'scale(1.03)' },
            },
            heartPop: {
              '0%': { transform: 'scale(1)' },
              '50%': { transform: 'scale(1.35)' },
              '100%': { transform: 'scale(1)' },
            },
            badgeShine: {
              '0%': { backgroundPosition: '200% 0' },
              '100%': { backgroundPosition: '-200% 0' },
            }
          }
        }
      }
    };
  </script>

  <!-- Custom CSS for Glassmorphism, Sheen and Scrollbars -->
  <style>
    /* Smooth theme transitions */
    * {
      transition: background-color 0.3s ease, border-color 0.3s ease, color 0.2s ease, box-shadow 0.3s ease;
    }

    /* Glassmorphism Styles */
    .glass-card-dark {
      background: rgba(15, 23, 42, 0.72);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.6), 
                  0 0 40px -10px rgba(99, 102, 241, 0.18),
                  inset 0 1px 1px 0 rgba(255, 255, 255, 0.12);
    }

    .glass-card-light {
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid rgba(226, 232, 240, 0.8);
      box-shadow: 0 25px 60px -15px rgba(99, 102, 241, 0.12),
                  0 10px 30px -10px rgba(0, 0, 0, 0.06),
                  inset 0 1px 2px 0 rgba(255, 255, 255, 0.9);
    }

    .glass-subcard-dark {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .glass-subcard-light {
      background: rgba(248, 250, 252, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(226, 232, 240, 0.8);
    }

    /* Subtle grid overlay for developer aesthetic */
    .bg-grid-pattern-dark {
      background-size: 32px 32px;
      background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
    }

    .bg-grid-pattern-light {
      background-size: 32px 32px;
      background-image: linear-gradient(to right, rgba(0, 0, 0, 0.03) 1px, transparent 1px),
                        linear-gradient(to bottom, rgba(0, 0, 0, 0.03) 1px, transparent 1px);
    }

    /* Custom Sheen highlight on card hover */
    .sheen-effect {
      position: relative;
      overflow: hidden;
    }
    .sheen-effect::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(
        45deg,
        transparent 45%,
        rgba(255, 255, 255, 0.08) 50%,
        transparent 55%
      );
      transform: rotate(25deg) translateY(-100%);
      transition: transform 0.8s ease-in-out;
      pointer-events: none;
    }
    .sheen-effect:hover::before {
      transform: rotate(25deg) translateY(100%);
    }

    /* Subtle custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.25);
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(148, 163, 184, 0.4);
    }
  </style>
</head>
<body class="min-h-screen selection:bg-brand-500 selection:text-white font-sans antialiased overflow-x-hidden">
  
  <!-- React Root Element -->
  <div id="root"></div>

  <!-- React & Babel Application Code -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    // ==========================================
    // 1. REUSABLE INLINE SVG ICON LIBRARY
    // (Keeps code 100% frontend-only and zero-dependency)
    // ==========================================
    const Icons = {
      Github: () => (
        <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path fillRule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clipRule="evenodd" />
        </svg>
      ),
      Linkedin: () => (
        <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
        </svg>
      ),
      Globe: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="10" />
          <path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" />
        </svg>
      ),
      Sun: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="5" />
          <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
        </svg>
      ),
      Moon: () => (
        <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
        </svg>
      ),
      Heart: ({ filled }) => (
        <svg 
          className={`w-5 h-5 transition-transform duration-300 ${filled ? 'fill-rose-500 stroke-rose-500 scale-110' : 'fill-none stroke-current'}`} 
          strokeWidth="2" 
          viewBox="0 0 24 24" 
          aria-hidden="true"
        >
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
        </svg>
      ),
      Verified: () => (
        <svg className="w-5 h-5 text-brand-500 fill-brand-500" viewBox="0 0 24 24" aria-label="Verified Developer">
          <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" />
        </svg>
      ),
      Location: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z" />
          <circle cx="12" cy="10" r="3" />
        </svg>
      ),
      Briefcase: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
          <rect x="2" y="7" width="20" height="14" rx="2" ry="2" />
          <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" />
        </svg>
      ),
      GraduationCap: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z" />
          <path d="M6 12v5c3 3 9 3 12 0v-5" />
        </svg>
      ),
      Code: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
          <polyline points="16 18 22 12 16 6" />
          <polyline points="8 6 2 12 8 18" />
        </svg>
      ),
      Sparkles: () => (
        <svg className="w-4 h-4 text-amber-400" fill="currentColor" viewBox="0 0 24 24">
          <path d="M12 2L9.5 9.5 2 12l7.5 2.5L12 22l2.5-7.5L22 12l-7.5-2.5L12 2z" />
        </svg>
      ),
      ExternalLink: () => (
        <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6" />
          <polyline points="15 3 21 3 21 9" />
          <line x1="10" y1="14" x2="21" y2="3" />
        </svg>
      ),
      Copy: () => (
        <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
      ),
      Check: () => (
        <svg className="w-4 h-4 text-emerald-500" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24">
          <polyline points="20 6 9 17 4 12" />
        </svg>
      ),
    };

    // ==========================================
    // 2. SKILL PILL COMPONENT WITH ICON/ACCENT
    // ==========================================
    function SkillBadge({ name, category, isDark }) {
      // Color accents based on technology family
      const colorSchemes = {
        react: 'border-cyan-500/30 text-cyan-400 bg-cyan-500/10 hover:border-cyan-400',
        js: 'border-amber-500/30 text-amber-400 bg-amber-500/10 hover:border-amber-400',
        node: 'border-emerald-500/30 text-emerald-400 bg-emerald-500/10 hover:border-emerald-400',
        express: 'border-slate-400/30 text-slate-300 bg-slate-500/10 hover:border-slate-300',
        mongo: 'border-green-500/30 text-green-400 bg-green-500/10 hover:border-green-400',
        sql: 'border-blue-500/30 text-blue-400 bg-blue-500/10 hover:border-blue-400',
        java: 'border-orange-500/30 text-orange-400 bg-orange-500/10 hover:border-orange-400',
        git: 'border-rose-500/30 text-rose-400 bg-rose-500/10 hover:border-rose-400',
        default: 'border-brand-500/30 text-brand-400 bg-brand-500/10 hover:border-brand-400',
      };

      const lightColorSchemes = {
        react: 'border-cyan-600/30 text-cyan-700 bg-cyan-50 hover:bg-cyan-100',
        js: 'border-amber-600/30 text-amber-700 bg-amber-50 hover:bg-amber-100',
        node: 'border-emerald-600/30 text-emerald-700 bg-emerald-50 hover:bg-emerald-100',
        express: 'border-slate-500/30 text-slate-800 bg-slate-100 hover:bg-slate-200',
        mongo: 'border-green-600/30 text-green-700 bg-green-50 hover:bg-green-100',
        sql: 'border-blue-600/30 text-blue-700 bg-blue-50 hover:bg-blue-100',
        java: 'border-orange-600/30 text-orange-700 bg-orange-50 hover:bg-orange-100',
        git: 'border-rose-600/30 text-rose-700 bg-rose-50 hover:bg-rose-100',
        default: 'border-brand-600/30 text-brand-700 bg-brand-50 hover:bg-brand-100',
      };

      const key = name.toLowerCase();
      let scheme = isDark ? colorSchemes.default : lightColorSchemes.default;

      if (key.includes('react')) scheme = isDark ? colorSchemes.react : lightColorSchemes.react;
      else if (key.includes('javascript') || key.includes('js')) scheme = isDark ? colorSchemes.js : lightColorSchemes.js;
      else if (key.includes('node')) scheme = isDark ? colorSchemes.node : lightColorSchemes.node;
      else if (key.includes('express')) scheme = isDark ? colorSchemes.express : lightColorSchemes.express;
      else if (key.includes('mongo')) scheme = isDark ? colorSchemes.mongo : lightColorSchemes.mongo;
      else if (key.includes('mysql') || key.includes('sql')) scheme = isDark ? colorSchemes.sql : lightColorSchemes.sql;
      else if (key.includes('java')) scheme = isDark ? colorSchemes.java : lightColorSchemes.java;
      else if (key.includes('git')) scheme = isDark ? colorSchemes.git : lightColorSchemes.git;

      return (
        <span 
          className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold tracking-wide border transition-all duration-300 hover:scale-105 cursor-default shadow-sm ${scheme}`}
        >
          <span className="w-1.5 h-1.5 rounded-full bg-current opacity-70 animate-pulse"></span>
          {name}
        </span>
      );
    }

    // ==========================================
    // 3. REUSABLE PROFILE CARD COMPONENT
    // Receives all developer profile data via Props
    // ==========================================
    function ProfileCard({
      name,
      role,
      bio,
      skills,
      avatar,
      socialLinks,
      statusText = "Open to Opportunities & Internships",
      location = "Bengaluru, India",
      education = "B.E. Computer Science & Engineering",
      initialLikes = 128,
      theme,
      onToggleTheme
    }) {
      // ----------------------------------------
      // React State Hooks
      // ----------------------------------------
      // State 1: Like Counter & liked status
      const [likes, setLikes] = useState(initialLikes);
      const [isLiked, setIsLiked] = useState(false);
      const [isAnimatingLike, setIsAnimatingLike] = useState(false);

      // State 2: Avatar Image Error Fallback Handler
      const [imageFailed, setImageFailed] = useState(false);

      // State 3: Copy Portfolio Link Feedback
      const [copied, setCopied] = useState(false);

      // Handler for Like Button Toggle
      const handleLikeToggle = () => {
        setIsAnimatingLike(true);
        if (isLiked) {
          setLikes(prev => prev - 1);
          setIsLiked(false);
        } else {
          setLikes(prev => prev + 1);
          setIsLiked(true);
        }
        setTimeout(() => setIsAnimatingLike(false), 450);
      };

      // Handler for copying portfolio URL
      const handleCopyPortfolio = () => {
        navigator.clipboard.writeText(socialLinks.portfolio);
        setCopied(true);
        setTimeout(() => setCopied(false), 2200);
      };

      const isDark = theme === 'dark';

      // Fallback Initials Avatar calculation
      const getInitials = (fullName) => {
        return fullName
          .split(' ')
          .map(part => part[0])
          .slice(0, 2)
          .join('')
          .toUpperCase();
      };

      return (
        <div className="relative w-full max-w-[480px] sm:max-w-[520px] transition-all duration-500">
          
          {/* Subtle Ambient Card Glow in Background */}
          <div className={`absolute -inset-1.5 rounded-[2.5rem] filter blur-xl opacity-60 transition duration-700 group-hover:opacity-100 ${
            isDark 
              ? 'bg-gradient-to-r from-brand-600/40 via-accent-cyan/30 to-accent-violet/40' 
              : 'bg-gradient-to-r from-brand-300/50 via-sky-200/50 to-indigo-300/50'
          }`}></div>

          {/* Main Glassmorphism Card Container */}
          <div 
            className={`relative rounded-[2.25rem] overflow-hidden transition-all duration-300 sheen-effect ${
              isDark ? 'glass-card-dark text-slate-100' : 'glass-card-light text-slate-800'
            }`}
          >
            
            {/* Top Interactive Bar: ApnoAI Badge & Theme Toggle */}
            <div className="relative z-10 flex items-center justify-between px-6 pt-5 pb-3">
              {/* ApnoAI Internship Task Badge */}
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full text-xs font-semibold tracking-wider uppercase border border-brand-500/30 bg-brand-500/10 text-brand-400">
                <Icons.Sparkles />
                <span>ApnoAI Task 2</span>
              </div>

              {/* Theme Toggle Button (Light/Dark Mode via useState) */}
              <button
                onClick={onToggleTheme}
                aria-label={`Switch to ${isDark ? 'Light' : 'Dark'} mode`}
                className={`p-2.5 rounded-2xl border transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-brand-500 ${
                  isDark 
                    ? 'border-white/10 bg-slate-800/80 text-amber-300 hover:bg-slate-700 hover:text-amber-200 shadow-inner' 
                    : 'border-slate-200 bg-white/90 text-slate-700 hover:bg-slate-100 hover:text-brand-600 shadow-sm'
                }`}
                title="Toggle Dark / Light Theme"
              >
                {isDark ? <Icons.Sun /> : <Icons.Moon />}
              </button>
            </div>

            {/* Profile Hero Header Banner */}
            <div className="relative px-6 pt-2 pb-6">
              
              {/* Decorative Subtle Header Mesh */}
              <div className="relative h-28 w-full rounded-2xl overflow-hidden bg-gradient-to-r from-brand-600 via-indigo-600 to-accent-cyan p-4 flex items-end justify-end shadow-md">
                <div className="absolute inset-0 bg-black/15 backdrop-blur-[1px]"></div>
                <div className="absolute top-2 right-3 font-mono text-[10px] tracking-widest text-white/70 uppercase">
                  Frontend • React 18
                </div>
              </div>

              {/* Avatar, Status & Core Identity */}
              <div className="relative -mt-14 flex flex-col sm:flex-row items-center sm:items-end gap-5 px-3">
                
                {/* Profile Photo with Safe Fallback */}
                <div className="relative group/avatar">
                  <div className={`w-28 h-28 rounded-2xl p-1.5 shadow-2xl transition-transform duration-300 group-hover/avatar:scale-105 ${
                    isDark ? 'bg-slate-900 border-2 border-brand-500/40' : 'bg-white border-2 border-brand-400/50'
                  }`}>
                    {!avatar || imageFailed ? (
                      /* Sleek Gradient Avatar with Developer Initials */
                      <div className="w-full h-full rounded-xl bg-gradient-to-br from-brand-600 via-indigo-600 to-accent-cyan flex flex-col items-center justify-center text-white shadow-inner select-none relative overflow-hidden">
                        <div className="absolute inset-0 bg-black/10"></div>
                        <span className="relative font-extrabold text-3xl tracking-wider font-mono drop-shadow-sm">
                          {getInitials(name)}
                        </span>
                        <span className="relative text-[9px] font-semibold tracking-widest font-mono text-cyan-200/90 uppercase mt-0.5">
                          Developer
                        </span>
                      </div>
                    ) : (
                      /* Main Profile Image (if avatar prop is provided) */
                      <img
                        src={avatar}
                        alt={`${name}'s developer portrait`}
                        decoding="sync"
                        onError={() => setImageFailed(true)}
                        style={{ objectPosition: '50% 20%' }}
                        className="w-full h-full rounded-xl object-cover shadow-md bg-slate-800"
                      />
                    )}
                  </div>

                  {/* Pulsing "Active & Ready" Status Indicator */}
                  <span 
                    className="absolute -bottom-1 -right-1 flex h-5 w-5"
                    title="Active Developer - Open to Work"
                  >
                    <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                    <span className="relative inline-flex rounded-full h-5 w-5 bg-emerald-500 border-2 border-white dark:border-slate-900"></span>
                  </span>
                </div>

                {/* Name, Role & Verification Badge */}
                <div className="flex-1 text-center sm:text-left mt-2 sm:mt-0">
                  <div className="flex items-center justify-center sm:justify-start gap-1.5">
                    <h1 className="text-2xl sm:text-3xl font-extrabold tracking-tight font-sans">
                      {name}
                    </h1>
                    <span title="Verified Full Stack Profile">
                      <Icons.Verified />
                    </span>
                  </div>
                  
                  <p className="mt-1 text-sm font-semibold bg-gradient-to-r from-brand-500 to-accent-cyan bg-clip-text text-transparent">
                    {role}
                  </p>

                  <div className="mt-2 flex flex-wrap items-center justify-center sm:justify-start gap-3 text-xs opacity-75">
                    <span className="inline-flex items-center gap-1">
                      <Icons.Location />
                      {location}
                    </span>
                    <span className="inline-flex items-center gap-1">
                      <Icons.GraduationCap />
                      CSE Student
                    </span>
                  </div>
                </div>

              </div>

              {/* Status Pill: "Available for Internships" */}
              <div className="mt-4 px-2">
                <div className={`flex items-center justify-center sm:justify-start gap-2 py-1.5 px-3.5 rounded-xl text-xs font-medium ${
                  isDark ? 'bg-slate-800/60 text-slate-300 border border-white/5' : 'bg-slate-100/90 text-slate-700 border border-slate-200'
                }`}>
                  <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                  <span className="truncate">{statusText}</span>
                </div>
              </div>

            </div>

            {/* Divider Line */}
            <div className={`h-px w-full ${isDark ? 'bg-gradient-to-r from-transparent via-white/10 to-transparent' : 'bg-gradient-to-r from-transparent via-slate-200 to-transparent'}`}></div>

            {/* About Me Section */}
            <div className="px-6 py-5">
              <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 flex items-center gap-1.5 mb-2.5">
                <Icons.Briefcase />
                About Developer
              </h2>
              <p className={`text-sm leading-relaxed ${isDark ? 'text-slate-300' : 'text-slate-600'}`}>
                {bio}
              </p>
            </div>

            {/* Skills & Technologies Section */}
            <div className="px-6 py-4">
              <div className="flex items-center justify-between mb-3">
                <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 flex items-center gap-1.5">
                  <Icons.Code />
                  Technical Skills & Stack
                </h2>
                <span className="text-[11px] font-mono opacity-60">
                  {skills.length} Technologies
                </span>
              </div>
              
              {/* Skill Pills Container */}
              <div className="flex flex-wrap gap-2">
                {skills.map((skill, index) => (
                  <SkillBadge 
                    key={index} 
                    name={typeof skill === 'string' ? skill : skill.name} 
                    isDark={isDark} 
                  />
                ))}
              </div>
            </div>

            {/* Interactive Stats & Like Button Row */}
            <div className="px-6 py-4">
              <div className={`p-4 rounded-2xl flex items-center justify-between gap-4 ${
                isDark ? 'glass-subcard-dark' : 'glass-subcard-light'
              }`}>
                
                {/* Like Button with Live Counter (Demonstrating useState) */}
                <div className="flex items-center gap-3">
                  <button
                    onClick={handleLikeToggle}
                    aria-label={`Like profile. Currently ${likes} likes.`}
                    className={`flex items-center gap-2.5 px-4 py-2.5 rounded-xl font-medium text-sm transition-all duration-300 focus:outline-none focus:ring-2 focus:ring-rose-400 ${
                      isLiked 
                        ? 'bg-rose-500/15 text-rose-500 border border-rose-500/30 shadow-sm' 
                        : isDark
                          ? 'bg-slate-800 text-slate-300 border border-white/10 hover:bg-slate-700 hover:text-white'
                          : 'bg-white text-slate-700 border border-slate-200 hover:bg-slate-50 hover:text-slate-900 shadow-sm'
                    }`}
                  >
                    <span className={isAnimatingLike ? 'animate-heart-pop' : ''}>
                      <Icons.Heart filled={isLiked} />
                    </span>
                    <span className="font-bold font-mono tracking-tight text-sm">
                      {likes}
                    </span>
                    <span className="text-xs opacity-75 font-sans hidden sm:inline">
                      {isLiked ? 'Liked!' : 'Applaud'}
                    </span>
                  </button>
                </div>

                {/* Quick Quick-Copy / Share Portfolio Button */}
                <button
                  onClick={handleCopyPortfolio}
                  className={`inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold transition-all duration-200 ${
                    copied 
                      ? 'bg-emerald-500/15 text-emerald-600 dark:text-emerald-400 border border-emerald-500/30' 
                      : isDark
                        ? 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/60'
                        : 'text-slate-500 hover:text-slate-800 hover:bg-slate-200/60'
                  }`}
                  title="Copy Portfolio link to clipboard"
                >
                  {copied ? <Icons.Check /> : <Icons.Copy />}
                  <span>{copied ? 'Copied Link!' : 'Share Portfolio'}</span>
                </button>

              </div>
            </div>

            {/* Social Links & Call to Action Footer */}
            <div className={`px-6 py-5 border-t ${
              isDark ? 'border-white/5 bg-slate-950/40' : 'border-slate-200/80 bg-slate-50/70'
            }`}>
              
              <div className="grid grid-cols-3 gap-3">
                {/* GitHub Link */}
                <a
                  href={socialLinks.github}
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="Visit Aravind's GitHub Profile"
                  className={`flex flex-col sm:flex-row items-center justify-center gap-1.5 py-2.5 px-3 rounded-xl text-xs font-semibold transition-all duration-300 hover:-translate-y-0.5 shadow-sm border ${
                    isDark 
                      ? 'bg-slate-900/90 hover:bg-slate-800 text-slate-200 border-white/10 hover:border-white/20' 
                      : 'bg-white hover:bg-slate-100 text-slate-800 border-slate-200 hover:border-slate-300'
                  }`}
                >
                  <Icons.Github />
                  <span>GitHub</span>
                </a>

                {/* LinkedIn Link */}
                <a
                  href={socialLinks.linkedin}
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="Connect with Aravind on LinkedIn"
                  className="flex flex-col sm:flex-row items-center justify-center gap-1.5 py-2.5 px-3 rounded-xl text-xs font-semibold transition-all duration-300 hover:-translate-y-0.5 shadow-sm border border-blue-500/30 bg-blue-600/10 text-blue-500 hover:bg-blue-600 hover:text-white"
                >
                  <Icons.Linkedin />
                  <span>LinkedIn</span>
                </a>

                {/* Live Portfolio Link */}
                <a
                  href={socialLinks.portfolio}
                  target="_blank"
                  rel="noopener noreferrer"
                  aria-label="Explore Aravind's Live Portfolio Website"
                  className="flex flex-col sm:flex-row items-center justify-center gap-1.5 py-2.5 px-3 rounded-xl text-xs font-semibold transition-all duration-300 hover:-translate-y-0.5 shadow-md bg-gradient-to-r from-brand-600 to-brand-500 text-white hover:from-brand-500 hover:to-indigo-500"
                >
                  <Icons.Globe />
                  <span>Portfolio</span>
                </a>
              </div>

              {/* Footer Note */}
              <div className="mt-4 text-center">
                <p className="text-[11px] opacity-60 font-mono">
                  Crafted for <span className="font-semibold text-brand-500">ApnoAI</span> Web Dev Internship • 2026
                </p>
              </div>

            </div>

          </div>

        </div>
      );
    }
